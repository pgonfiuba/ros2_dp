
services:
  ros2_dp:
    image: ghcr.io/pgonfiuba/ros2-clases:jazzy

    build:                             
      context: ../
      dockerfile: ./docker/Dockerfile
      args:
        ROS_DISTRO: jazzy
      target: base

    stdin_open: true
    tty: true

    command: "/bin/bash"

    network_mode: host
    ipc: host

    environment:
      - ROS_DOMAIN_ID=42
      - DISPLAY=${DISPLAY}

    devices:
      - "/dev/dri:/dev/dri"

    volumes:
      - $HOME/.Xauthority:/root/.Xauthority:ro
      - ../src:/root/ros2_ws/src